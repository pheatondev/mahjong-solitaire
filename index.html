<!DOCTYPE html>
<!-- Mahjong Lite — v1 M1 (rules core). No build step: what's in the repo is what's deployed (§2.1).
     Serve over HTTP (`python -m http.server`) — ES modules + level fetches never work from file:// (§14.1). -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- No external requests at runtime (§22); inline SVG faces + inline styles need 'unsafe-inline' styles. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'">
  <!-- viewport-fit=cover for safe areas (§9.1); user-scalable=no kills double-tap zoom (§16 locked). -->
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#ff5d8f">
  <title>Mahjong Lite</title>
  <!-- PWA (§15): relative URLs only — Pages deploys under a subpath (§2.1). -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/anim.css">
</head>
<body data-theme="bubblegum">
  <div id="bg" aria-hidden="true"></div>

  <!-- The locked 9:16 stage (§9.1): all layout math is 390×844 design px, uniformly scaled. -->
  <div id="stage">

    <!-- §9.4 Level select — M2 boots here (Home screen arrives in M3). -->
    <section id="scr-levels" class="screen hidden" aria-label="Level select">
      <header id="lvl-head">
        <button id="btn-levels-back" class="hbtn" aria-label="Back">←</button>
        <h2 id="lvl-title"></h2>
        <span id="lvl-stars"></span>
      </header>
      <div id="lvl-scroll"></div>
      <p id="lvl-hint"></p>
    </section>

    <section id="scr-game" class="screen" aria-label="Game">
    <header id="hud">
      <button id="btn-pause" class="hbtn" aria-label="Pause">‖</button>
      <span id="chip">Melon · L1</span>
      <div id="hud-right">
        <span id="stars" aria-label="Live star projection"></span>
        <span id="score">0</span>
      </div>
    </header>

    <!-- The tin: 4 slots, top HUD zone (§3.3/§9.4). Banked slots are a dead zone (§9.5 locked). -->
    <div id="bank" aria-label="Bank">
      <div class="slot" data-slot="0"></div>
      <div class="slot" data-slot="1"></div>
      <div class="slot" data-slot="2"></div>
      <div class="slot" data-slot="3"></div>
    </div>

    <div id="combo" aria-hidden="true"></div>

    <main id="board">
      <div id="grid"></div>
    </main>

    <footer id="bar">
      <!-- §5 boosters (all player-tapped, no auto-assist — §2.4/§5) + free Restart (§3.6) -->
      <button id="btn-undo" class="btn round" aria-label="Undo"><span class="bic">↩</span>Undo</button>
      <button id="btn-shuffle" class="btn round" aria-label="Shuffle"><span class="bic">🔄</span>Shuffle</button>
      <button id="btn-hint" class="btn round" aria-label="Hint"><span class="bic">💡</span>Hint</button>
    </footer>

    <!-- §9.4 first-run tooltip: one-time (level 1), dismisses on the first bank tap;
         doubles as the audio-unlock gesture (§12). -->
    <div id="tip" role="status" class="tipbubble"></div>
    </section><!-- /scr-game -->

    <!-- Home (§9.4) — content built by src/view/screens/home.js -->
    <section id="scr-home" class="screen hidden" aria-label="Home"></section>

    <!-- Stats (§9.4) — cards built by src/view/screens/stats.js -->
    <section id="scr-stats" class="screen hidden" aria-label="Stats"></section>

    <!-- Settings (§9.4/§12.2/§13) — rows built by src/view/screens/settings.js -->
    <section id="scr-settings" class="screen hidden" aria-label="Settings"></section>

    <div id="fx" aria-hidden="true"></div>

    <div id="ovl-win" class="overlay" role="dialog" aria-modal="true" aria-labelledby="win-title">
      <div class="panel">
        <h2 id="win-title"></h2>
        <div id="win-stars">
          <span class="st">★</span><span class="st">★</span><span class="st">★</span>
        </div>
        <div id="win-score">0</div>
        <div id="win-best" class="best-badge" hidden></div>
        <div class="bigbtns">
          <button id="btn-next" class="btn wide primary"></button>
          <button id="btn-replay" class="btn wide"></button>
          <button id="btn-map2" class="btn wide"></button>
        </div>
      </div>
    </div>

    <!-- §5.3 no-progress dialog: fires on the strict pre-seal state only; modal, no
         scrim-dismiss (locked). Buttons mirror the §5 ladder — nothing auto-plays. -->
    <div id="dlg-nopro" class="overlay" role="dialog" aria-modal="true" aria-labelledby="nopro-title">
      <div class="panel">
        <h2 id="nopro-title"></h2>
        <p id="nopro-body"></p>
        <div class="bigbtns colbtns">
          <button id="btn-dlg-shuffle" class="btn wide primary"></button>
          <button id="btn-dlg-undo" class="btn wide"></button>
          <button id="btn-dlg-restart" class="btn wide"></button>
          <button id="btn-dlg-map" class="btn wide"></button>
        </div>
      </div>
    </div>

    <div id="ovl-fail" class="overlay" role="dialog" aria-modal="true" aria-labelledby="fail-title">
      <div class="panel">
        <h2 id="fail-title"></h2>
        <p id="fail-body"></p>
        <!-- the four sealed candies, at 78% mini scale (§3.6) -->
        <div id="fail-tiles" aria-hidden="true"></div>
        <div class="bigbtns colbtns">
          <button id="btn-fail-restart" class="btn wide primary"></button>
          <button id="btn-fail-map" class="btn wide"></button>
        </div>
      </div>
    </div>

    <!-- §9.4 pause panel: player-initiated only (the tab-hide clock freeze is §16 and
         opens nothing). Restart/Settings/Map route out; Resume returns to play. -->
    <div id="dlg-pause" class="overlay" role="dialog" aria-modal="true" aria-labelledby="pause-title">
      <div class="panel">
        <h2 id="pause-title"></h2>
        <p id="pause-sub"></p>
        <div class="bigbtns colbtns">
          <button id="btn-p-resume" class="btn wide primary"></button>
          <button id="btn-p-restart" class="btn wide"></button>
          <button id="btn-p-settings" class="btn wide"></button>
          <button id="btn-p-map" class="btn wide"></button>
        </div>
      </div>
    </div>

    <!-- §13 mitigation 1: home-screen install promo — once, after level 3 completes.
         On Chromium the CTA fires the captured beforeinstallprompt; elsewhere the copy
         alone steers to the browser's Share menu. -->
    <div id="dlg-promo" class="overlay" role="dialog" aria-modal="true" aria-labelledby="promo-title">
      <div class="panel">
        <h2 id="promo-title"></h2>
        <p id="promo-body"></p>
        <div class="bigbtns colbtns">
          <button id="btn-promo-cta" class="btn wide primary"></button>
          <button id="btn-promo-later" class="btn wide"></button>
        </div>
      </div>
    </div>

    <!-- §13 destructive reset, second stage of the double-confirm. -->
    <div id="dlg-reset" class="overlay" role="dialog" aria-modal="true" aria-labelledby="reset-title">
      <div class="panel">
        <h2 id="reset-title"></h2>
        <p id="reset-body"></p>
        <div class="bigbtns colbtns">
          <button id="btn-reset-yes" class="btn wide danger"></button>
          <button id="btn-reset-cancel" class="btn wide"></button>
        </div>
      </div>
    </div>

    <!-- §13 storage-failure toast (one-time, non-blocking) -->
    <div id="toast" role="status" aria-live="polite"></div>
  </div>

  <!-- Tile face sprite (§11): ALL faces are inline SVG symbols — zero raster assets, no extra requests.
      Standard 136-tile deck only; decorative flowers/seasons symbols ship for backlog variants (§11). -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <radialGradient id="gdot" cx="0.35" cy="0.3" r="1">
        <stop offset="0" stop-color="#9ed6ff"/><stop offset="0.55" stop-color="#3f9bea"/><stop offset="1" stop-color="#1f74c0"/>
      </radialGradient>
      <linearGradient id="gbam" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#7fe3a0"/><stop offset="1" stop-color="#2fa55e"/>
      </linearGradient>
      <!-- bamboo stick primitive (reused by tile-b*) -->
      <g id="bam-stick">
        <rect x="-3.5" y="-14" width="7" height="28" rx="3.5" fill="url(#gbam)"/>
        <rect x="-3.5" y="-4" width="7" height="1.6" fill="#17692f" opacity=".35"/>
        <rect x="-3.5" y="2.5" width="7" height="1.6" fill="#17692f" opacity=".35"/>
      </g>
    </defs>

    <!-- §3.5 face-down back: candy stripes in the chapter accent (CSS vars cascade into
         <use> shadow trees, so one symbol re-tints per chapter automatically). Same
         in-browser rasterization as §15 icons — zero extra requests. -->
    <symbol id="tile-back" viewBox="0 0 100 100">
      <path d="M18,16 Q30,50 18,84 M40,14 Q52,50 40,86 M62,14 Q74,50 62,86 M82,16 Q90,50 84,84"
            fill="none" stroke="var(--accent)" stroke-width="7" stroke-linecap="round" opacity=".8"/>
      <circle cx="50" cy="50" r="8" fill="var(--accent)" opacity=".9"/>
    </symbol>

    <!-- Dots 1–9 — rank-count candy dots, rank-4 = clover arrangement (§11). Keyline blue #4aa3ff. -->
    <symbol id="tile-d1" viewBox="0 0 100 100"><circle cx="50" cy="50" r="15" fill="url(#gdot)"/><circle cx="45.8" cy="44.9" r="4.5" fill="#fff" opacity=".7"/></symbol>
    <symbol id="tile-d2" viewBox="0 0 100 100"><circle cx="50" cy="27" r="13" fill="url(#gdot)"/><circle cx="46.4" cy="22.6" r="3.9" fill="#fff" opacity=".7"/><circle cx="50" cy="73" r="13" fill="url(#gdot)"/><circle cx="46.4" cy="68.6" r="3.9" fill="#fff" opacity=".7"/></symbol>
    <symbol id="tile-d3" viewBox="0 0 100 100"><circle cx="30" cy="30" r="11" fill="url(#gdot)"/><circle cx="26.9" cy="26.3" r="3.3" fill="#fff" opacity=".7"/><circle cx="50" cy="50" r="11" fill="url(#gdot)"/><circle cx="46.9" cy="46.3" r="3.3" fill="#fff" opacity=".7"/><circle cx="70" cy="70" r="11" fill="url(#gdot)"/><circle cx="66.9" cy="66.3" r="3.3" fill="#fff" opacity=".7"/></symbol>
    <symbol id="tile-d4" viewBox="0 0 100 100"><circle cx="30" cy="30" r="11" fill="url(#gdot)"/><circle cx="26.9" cy="26.3" r="3.3" fill="#fff" opacity=".7"/><circle cx="70" cy="30" r="11" fill="url(#gdot)"/><circle cx="66.9" cy="26.3" r="3.3" fill="#fff" opacity=".7"/><circle cx="30" cy="70" r="11" fill="url(#gdot)"/><circle cx="26.9" cy="66.3" r="3.3" fill="#fff" opacity=".7"/><circle cx="70" cy="70" r="11" fill="url(#gdot)"/><circle cx="66.9" cy="66.3" r="3.3" fill="#fff" opacity=".7"/></symbol>
    <symbol id="tile-d5" viewBox="0 0 100 100"><circle cx="30" cy="30" r="10" fill="url(#gdot)"/><circle cx="27.2" cy="26.6" r="3" fill="#fff" opacity=".7"/><circle cx="70" cy="30" r="10" fill="url(#gdot)"/><circle cx="67.2" cy="26.6" r="3" fill="#fff" opacity=".7"/><circle cx="50" cy="50" r="10" fill="url(#gdot)"/><circle cx="47.2" cy="46.6" r="3" fill="#fff" opacity=".7"/><circle cx="30" cy="70" r="10" fill="url(#gdot)"/><circle cx="27.2" cy="66.6" r="3" fill="#fff" opacity=".7"/><circle cx="70" cy="70" r="10" fill="url(#gdot)"/><circle cx="67.2" cy="66.6" r="3" fill="#fff" opacity=".7"/></symbol>
    <symbol id="tile-d6" viewBox="0 0 100 100"><circle cx="30" cy="22" r="11" fill="url(#gdot)"/><circle cx="26.9" cy="18.3" r="3.3" fill="#fff" opacity=".7"/><circle cx="70" cy="22" r="11" fill="url(#gdot)"/><circle cx="66.9" cy="18.3" r="3.3" fill="#fff" opacity=".7"/><circle cx="30" cy="50" r="11" fill="url(#gdot)"/><circle cx="26.9" cy="46.3" r="3.3" fill="#fff" opacity=".7"/><circle cx="70" cy="50" r="11" fill="url(#gdot)"/><circle cx="66.9" cy="46.3" r="3.3" fill="#fff" opacity=".7"/><circle cx="30" cy="78" r="11" fill="url(#gdot)"/><circle cx="26.9" cy="74.3" r="3.3" fill="#fff" opacity=".7"/><circle cx="70" cy="78" r="11" fill="url(#gdot)"/><circle cx="66.9" cy="74.3" r="3.3" fill="#fff" opacity=".7"/></symbol>
    <symbol id="tile-d7" viewBox="0 0 100 100"><circle cx="28" cy="26" r="9.5" fill="url(#gdot)"/><circle cx="25.3" cy="22.8" r="2.9" fill="#fff" opacity=".7"/><circle cx="50" cy="26" r="9.5" fill="url(#gdot)"/><circle cx="47.3" cy="22.8" r="2.9" fill="#fff" opacity=".7"/><circle cx="72" cy="26" r="9.5" fill="url(#gdot)"/><circle cx="69.3" cy="22.8" r="2.9" fill="#fff" opacity=".7"/><circle cx="38" cy="52" r="9.5" fill="url(#gdot)"/><circle cx="35.3" cy="48.8" r="2.9" fill="#fff" opacity=".7"/><circle cx="62" cy="52" r="9.5" fill="url(#gdot)"/><circle cx="59.3" cy="48.8" r="2.9" fill="#fff" opacity=".7"/><circle cx="28" cy="76" r="9.5" fill="url(#gdot)"/><circle cx="25.3" cy="72.8" r="2.9" fill="#fff" opacity=".7"/><circle cx="72" cy="76" r="9.5" fill="url(#gdot)"/><circle cx="69.3" cy="72.8" r="2.9" fill="#fff" opacity=".7"/></symbol>
    <symbol id="tile-d8" viewBox="0 0 100 100"><circle cx="30" cy="20" r="9" fill="url(#gdot)"/><circle cx="27.5" cy="16.9" r="2.7" fill="#fff" opacity=".7"/><circle cx="70" cy="20" r="9" fill="url(#gdot)"/><circle cx="67.5" cy="16.9" r="2.7" fill="#fff" opacity=".7"/><circle cx="30" cy="40" r="9" fill="url(#gdot)"/><circle cx="27.5" cy="36.9" r="2.7" fill="#fff" opacity=".7"/><circle cx="70" cy="40" r="9" fill="url(#gdot)"/><circle cx="67.5" cy="36.9" r="2.7" fill="#fff" opacity=".7"/><circle cx="30" cy="60" r="9" fill="url(#gdot)"/><circle cx="27.5" cy="56.9" r="2.7" fill="#fff" opacity=".7"/><circle cx="70" cy="60" r="9" fill="url(#gdot)"/><circle cx="67.5" cy="56.9" r="2.7" fill="#fff" opacity=".7"/><circle cx="30" cy="80" r="9" fill="url(#gdot)"/><circle cx="27.5" cy="76.9" r="2.7" fill="#fff" opacity=".7"/><circle cx="70" cy="80" r="9" fill="url(#gdot)"/><circle cx="67.5" cy="76.9" r="2.7" fill="#fff" opacity=".7"/></symbol>
    <symbol id="tile-d9" viewBox="0 0 100 100"><circle cx="28" cy="25" r="9" fill="url(#gdot)"/><circle cx="25.5" cy="21.9" r="2.7" fill="#fff" opacity=".7"/><circle cx="50" cy="25" r="9" fill="url(#gdot)"/><circle cx="47.5" cy="21.9" r="2.7" fill="#fff" opacity=".7"/><circle cx="72" cy="25" r="9" fill="url(#gdot)"/><circle cx="69.5" cy="21.9" r="2.7" fill="#fff" opacity=".7"/><circle cx="28" cy="50" r="9" fill="url(#gdot)"/><circle cx="25.5" cy="46.9" r="2.7" fill="#fff" opacity=".7"/><circle cx="50" cy="50" r="9" fill="url(#gdot)"/><circle cx="47.5" cy="46.9" r="2.7" fill="#fff" opacity=".7"/><circle cx="72" cy="50" r="9" fill="url(#gdot)"/><circle cx="69.5" cy="46.9" r="2.7" fill="#fff" opacity=".7"/><circle cx="28" cy="75" r="9" fill="url(#gdot)"/><circle cx="25.5" cy="71.9" r="2.7" fill="#fff" opacity=".7"/><circle cx="50" cy="75" r="9" fill="url(#gdot)"/><circle cx="47.5" cy="71.9" r="2.7" fill="#fff" opacity=".7"/><circle cx="72" cy="75" r="9" fill="url(#gdot)"/><circle cx="69.5" cy="71.9" r="2.7" fill="#fff" opacity=".7"/></symbol>

    <!-- Bamboo 1–9 — rounded sticks; rank-1 = tiny bird emoji (§11). Keyline green #3ec46d. -->
    <symbol id="tile-b1" viewBox="0 0 100 100"><text x="50" y="66" font-size="46" text-anchor="middle">🐦</text></symbol>
    <symbol id="tile-b2" viewBox="0 0 100 100"><use href="#bam-stick" transform="translate(50,32)"/><use href="#bam-stick" transform="translate(50,68)"/></symbol>
    <symbol id="tile-b3" viewBox="0 0 100 100"><use href="#bam-stick" transform="translate(50,30) rotate(25)"/><use href="#bam-stick" transform="translate(32,72)"/><use href="#bam-stick" transform="translate(68,72)"/></symbol>
    <symbol id="tile-b4" viewBox="0 0 100 100"><use href="#bam-stick" transform="translate(35,30)"/><use href="#bam-stick" transform="translate(65,30)"/><use href="#bam-stick" transform="translate(35,70)"/><use href="#bam-stick" transform="translate(65,70)"/></symbol>
    <symbol id="tile-b5" viewBox="0 0 100 100"><use href="#bam-stick" transform="translate(30,32) rotate(35)"/><use href="#bam-stick" transform="translate(70,32) rotate(-35)"/><use href="#bam-stick" transform="translate(30,68) rotate(-35)"/><use href="#bam-stick" transform="translate(70,68) rotate(35)"/><use href="#bam-stick" transform="translate(50,50)"/></symbol>
    <symbol id="tile-b6" viewBox="0 0 100 100"><use href="#bam-stick" transform="translate(32,26)"/><use href="#bam-stick" transform="translate(50,26)"/><use href="#bam-stick" transform="translate(68,26)"/><use href="#bam-stick" transform="translate(32,70)"/><use href="#bam-stick" transform="translate(50,70)"/><use href="#bam-stick" transform="translate(68,74) rotate(90)"/></symbol>
    <symbol id="tile-b7" viewBox="0 0 100 100"><use href="#bam-stick" transform="translate(50,20) rotate(90)"/><use href="#bam-stick" transform="translate(28,48)"/><use href="#bam-stick" transform="translate(50,48)"/><use href="#bam-stick" transform="translate(72,48)"/><use href="#bam-stick" transform="translate(28,80)"/><use href="#bam-stick" transform="translate(50,80)"/><use href="#bam-stick" transform="translate(72,80)"/></symbol>
    <symbol id="tile-b8" viewBox="0 0 100 100"><use href="#bam-stick" transform="translate(36,22)"/><use href="#bam-stick" transform="translate(64,22)"/><use href="#bam-stick" transform="translate(36,42)"/><use href="#bam-stick" transform="translate(64,42)"/><use href="#bam-stick" transform="translate(36,62)"/><use href="#bam-stick" transform="translate(64,62)"/><use href="#bam-stick" transform="translate(36,82)"/><use href="#bam-stick" transform="translate(64,82)"/></symbol>
    <symbol id="tile-b9" viewBox="0 0 100 100"><use href="#bam-stick" transform="translate(28,22)"/><use href="#bam-stick" transform="translate(50,22)"/><use href="#bam-stick" transform="translate(72,22)"/><use href="#bam-stick" transform="translate(28,50)"/><use href="#bam-stick" transform="translate(50,50)"/><use href="#bam-stick" transform="translate(72,50)"/><use href="#bam-stick" transform="translate(28,78)"/><use href="#bam-stick" transform="translate(50,78)"/><use href="#bam-stick" transform="translate(72,78)"/></symbol>

    <!-- Characters 1–9 — Chinese numerals 一–九 over 萬, red glyph style (§11). Keyline red #ff4d4d. -->

    <symbol id="tile-c2" viewBox="0 0 100 100"><text x="50" y="44" font-size="42" font-weight="700" text-anchor="middle" fill="#e1333f">二</text><text x="50" y="88" font-size="34" font-weight="700" text-anchor="middle" fill="#e1333f">萬</text></symbol>
    <symbol id="tile-c3" viewBox="0 0 100 100"><text x="50" y="44" font-size="42" font-weight="700" text-anchor="middle" fill="#e1333f">三</text><text x="50" y="88" font-size="34" font-weight="700" text-anchor="middle" fill="#e1333f">萬</text></symbol>
    <symbol id="tile-c4" viewBox="0 0 100 100"><text x="50" y="44" font-size="42" font-weight="700" text-anchor="middle" fill="#e1333f">四</text><text x="50" y="88" font-size="34" font-weight="700" text-anchor="middle" fill="#e1333f">萬</text></symbol>
    <symbol id="tile-c5" viewBox="0 0 100 100"><text x="50" y="44" font-size="42" font-weight="700" text-anchor="middle" fill="#e1333f">五</text><text x="50" y="88" font-size="34" font-weight="700" text-anchor="middle" fill="#e1333f">萬</text></symbol>
    <symbol id="tile-c6" viewBox="0 0 100 100"><text x="50" y="44" font-size="42" font-weight="700" text-anchor="middle" fill="#e1333f">六</text><text x="50" y="88" font-size="34" font-weight="700" text-anchor="middle" fill="#e1333f">萬</text></symbol>
    <symbol id="tile-c7" viewBox="0 0 100 100"><text x="50" y="44" font-size="42" font-weight="700" text-anchor="middle" fill="#e1333f">七</text><text x="50" y="88" font-size="34" font-weight="700" text-anchor="middle" fill="#e1333f">萬</text></symbol>
    <symbol id="tile-c8" viewBox="0 0 100 100"><text x="50" y="44" font-size="42" font-weight="700" text-anchor="middle" fill="#e1333f">八</text><text x="50" y="88" font-size="34" font-weight="700" text-anchor="middle" fill="#e1333f">萬</text></symbol>

    <!-- Winds — letter tile + compass needle (§11). Wind rule (user-ruled for §14 legibility):
